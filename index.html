            --accent: #9E472A;

        header {

            border: 1px solid var(--primary);
            border-radius: 4px;
            padding: 44px 48px 40px;
            margin-bottom: 36px;

            box-shadow: 6px 6px 0px rgba(28, 27, 24, 0.08);
        }

        .masthead-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 14px;
            margin-bottom: 28px;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary-muted);
            font-weight: 500;
        }

        .spec-pill {
            background-color: var(--primary);
            color: var(--card-bg);
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 500;

            color: var(--primary);

            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--primary-muted);
            padding: 9px 20px;
            border-radius: 99px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(255, 255, 255, 0.5);
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--card-bg);
            border-color: var(--primary);

            min-width: 250px;
            max-width: 340px;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            padding: 10px 18px;
            border-radius: 99px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            font-size: 13.5px;
            color: var(--primary);
            outline: none;
            transition: all 0.25s;
        }

        .search-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(158, 71, 42, 0.12);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 26px;
        }

        .insight-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 28px 26px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .insight-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--primary);
            opacity: 0.15;
            transition: opacity 0.28s, background 0.28s;
        }

        .insight-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 6px 6px 0px rgba(28, 27, 24, 0.1);
        }

        .insight-card:hover::before {
            opacity: 1;
            background: var(--accent);
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .cat-badge {
            font-size: 11.5px;
            font-weight: 500;
            color: #FFFFFF;
            padding: 3px 11px;
            border-radius: 3px;
            letter-spacing: 1px;
        }

        .cat-badge.theory { background-color: var(--tag-theory); }
        .cat-badge.issue { background-color: var(--tag-issue); }
        .cat-badge.case { background-color: var(--tag-case); }

        .entry-index {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 24px;
            font-weight: 600;
            font-style: italic;
            color: #C4BDB0;
            line-height: 1;
        }

        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 21px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .card-en-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 14px;
        }

        .card-summary {
            font-size: 14px;
            color: var(--primary-muted);
            margin-bottom: 24px;
            font-weight: 300;
            line-height: 1.7;

        .card-footer {
            border-top: 1px solid #EAE5DC;
            padding-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .keyword-chip {
            font-size: 11.5px;
            background: #EFECE6;
            color: var(--primary-muted);
            padding: 2px 9px;
            border-radius: 3px;

        .read-link {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: transform 0.2s;
        }

        .insight-card:hover .read-link {
            transform: translateX(3px);
        }

            inset: 0;
            background: rgba(28, 27, 24, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-panel {
            background: var(--card-bg);
            max-width: 680px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            border-radius: 6px;
            padding: 40px 38px;
            border: 1px solid var(--primary);
            box-shadow: 10px 10px 0px rgba(28, 27, 24, 0.2);
            position: relative;
            animation: modalIn 0.25s ease;

            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--primary);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close-btn:hover {
            background: var(--primary);
            color: var(--card-bg);
        }

        .modal-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 26px;
            font-weight: 900;
            margin-top: 14px;
            margin-bottom: 4px;
            line-height: 1.35;
        }

        .modal-en {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-style: italic;
            font-size: 18px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-section {
            background: #F6F3EC;
            border-left: 3px solid var(--tag-theory);
            padding: 18px 20px;
            margin-bottom: 16px;
        }

        .modal-section.case-box {
            border-left-color: var(--tag-case);
            background: #F1F5F3;
        }

        .modal-section.reflection-box {
            border-left-color: var(--accent);

            font-size: 14.5px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);

        }

        .modal-section p {
            font-size: 14.5px;
            color: #33302B;
            line-height: 1.8;
            font-weight: 400;
        }

        @media (max-width: 640px) {
            header { padding: 28px 22px; }
            .modal-panel { padding: 28px 22px; }

</head>

<div class="container">
    <!-- 1. Header 刊頭區 -->
    <header>
        <div class="masthead-bar">

</div>

            categoryLabel: "傳播理論",
            title: "沉默螺旋與社群同溫層效應",
            enTitle: "Spiral of Silence in Echo Chambers",
            keywords: ["民意氣候", "孤立恐懼", "社群出征"],
            summary: "人們因害怕被群體孤立而選擇隱藏少數意見，但在分眾演算法下呈現出「多頭螺旋」的新樣貌。",
            coreConcept: "Noelle-Neumann (1974) 提出，個人會透過「準統計感官」觀察周遭的意見氣候；若發現自己的立場屬於少數，會因害怕遭受孤立或攻擊而保持沉默，導致強勢意見看似越來越強。",
            taiwanCase: "在台灣高度極化的社群討論（如選舉期間或社會爭議事件）中，不同平台（如 PTT、Dcard、Threads、臉書社團）往往形成截然不同的優勢意見氣候。使用者在逆風平台選擇潛水沉默，轉而退回自己的同溫層發聲。",
            reflection: "在演算法打造的「過濾氣泡（Filter Bubble）」中，受訪者所感知到的「主流民意」往往已經過扭曲；這如何影響我們在問卷調查中測量「公開抵制/公開發聲意願」與「私下個人行為意向」之間的落差？"
        }
    ];

    let activeCat = 'all';

    function setCategory(cat, btn) {
        activeCat = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderEntries();
    }

    function renderEntries() {
        const grid = document.getElementById('cardGrid');
        const q = document.getElementById('searchInput').value.trim().toLowerCase();

        const filtered = WIKI_ENTRIES.filter(item => {
            const matchCat = activeCat === 'all' || item.category === activeCat;
            const matchQuery = !q ||
                item.title.toLowerCase().includes(q) ||
                item.enTitle.toLowerCase().includes(q) ||
                item.summary.toLowerCase().includes(q) ||
                item.taiwanCase.toLowerCase().includes(q) ||
                item.keywords.some(k => k.toLowerCase().includes(q));
            return matchCat && matchQuery;
        });

        document.getElementById('statsCounter').textContent =
            `ARCHIVE: ${filtered.length} / ${WIKI_ENTRIES.length} ENTRIES`;

        grid.innerHTML = filtered.map((item, idx) => `
            <article class="insight-card" onclick="openEntry('${item.id}')">
                <div>
                    <div class="card-meta-top">
                        <span class="cat-badge ${item.category}">${item.categoryLabel}</span>
                        <span class="entry-index">0${idx + 1}</span>
                    </div>
                    <h3 class="card-title">${item.title}</h3>
                    <div class="card-en-title">${item.enTitle}</div>
                    <p class="card-summary">${item.summary}</p>
                </div>
                <div class="card-footer">
                    <div class="keyword-list">
                        ${item.keywords.map(k => `<span class="keyword-chip">#${k}</span>`).join('')}
                    </div>
                    <span class="read-link">READ ↗</span>
                </div>
            </article>
        `).join('');
    }

    function openEntry(id) {
        const item = WIKI_ENTRIES.find(e => e.id === id);
        if (!item) return;

        const badge = document.getElementById('m-badge');
        badge.textContent = item.categoryLabel;
        badge.className = `cat-badge ${item.category}`;

        document.getElementById('m-id').textContent = item.id.toUpperCase();
        document.getElementById('m-title').textContent = item.title;
        document.getElementById('m-en').textContent = item.enTitle;
        document.getElementById('m-concept').textContent = item.coreConcept;
        document.getElementById('m-case').textContent = item.taiwanCase;
        document.getElementById('m-reflection').textContent = item.reflection;

        document.getElementById('m-keywords').innerHTML =
            item.keywords.map(k => `<span class="keyword-chip">#${k}</span>`).join('');

        document.getElementById('articleModal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('articleModal').classList.remove('open');
    }

    window.onload = renderEntries;
</script>

</body>
</html>
